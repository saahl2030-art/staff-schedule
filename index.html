<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#18356f"><title>نظام الدوام والإجازات</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#1d2e4a;font:16px/1.6 Tahoma,Arial,sans-serif}header{background:white;text-align:center;border-bottom:3px solid #c5a45b;padding:18px}.logo{display:grid;place-items:center;background:#18356f;color:white;border-radius:14px;width:50px;height:50px;margin:auto;font-weight:bold;font-size:22px}h1,h2,h3{color:#18356f}h1{font-size:24px;margin:5px}main{max-width:1100px;margin:auto;padding:20px 15px}.bar,.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.bar{justify-content:space-between;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.card{background:white;border:1px solid #dce4ef;border-radius:14px;padding:16px}.card h3{margin:0}.scroll{overflow:auto;max-width:100%}table{border-collapse:collapse;font-size:13px}th,td{border:1px solid #dce4ef;padding:8px;text-align:center;min-width:52px}th:first-child{position:sticky;right:0;z-index:1;background:#f8faff;min-width:130px}td[data-date]{cursor:pointer}.work{background:#d8f1de}.off{background:#fff2bc}.leave{background:#d5eafa}button,select,input{font:inherit;border-radius:8px;padding:9px;border:1px solid #ccd8e8}button{background:#18356f;color:white;border:0;cursor:pointer}.sub{background:#eaf0f8;color:#18356f}.danger{background:#fff0f0;color:#a32b2b}.small{font-size:12px;padding:5px}label{display:block;margin:12px 0}input{display:block;width:100%;max-width:350px}.hint,#message{color:#596b83;font-size:14px}#message{min-height:24px}#logout{position:absolute;left:12px;top:12px}@media(max-width:600px){header{padding:14px}h1{font-size:20px}main{padding:12px}th,td{padding:7px;min-width:45px}}</style></head><body><header><button class="sub" id="logout">خروج</button><div class="logo">S</div><h1>نظام الدوام والإجازات</h1><small>الأقسام وجدول الموظفين</small></header><main><div id="message" role="status"></div><div id="app">جارٍ التحميل...</div><p class="hint">التنبيهات غير مفعّلة حالياً.</p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script><script>(function(){
const db=window.supabase.createClient('https://tlrwmxgnxidytsoyqvjz.supabase.co','sb_publishable_tWSCm6CN_-VKcYLZm8mBKQ_VdZ030EO');
const root=document.getElementById('app');let session=null,departments=[],employees=[],rotations=[],overrides=[],dept=null,offset=0,mode='month';
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=()=>crypto.randomUUID(), dateStr=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const fromDay=s=>{let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)};
const monday=d=>{let n=new Date(d.getFullYear(),d.getMonth(),d.getDate(),12);n.setDate(n.getDate()-((n.getDay()+6)%7));return n};
const weekDiff=(a,b)=>Math.round((Date.UTC(a.getFullYear(),a.getMonth(),a.getDate())-Date.UTC(b.getFullYear(),b.getMonth(),b.getDate()))/604800000);
function notify(text){document.getElementById('message').textContent=text}
function showError(err){notify('تعذر إتمام العملية: '+(err?.message||String(err)))}
async function act(p){try{notify('جارٍ الحفظ...');let r=await p;if(r.error)throw r.error;await load();notify('تم الحفظ');return true}catch(e){showError(e);return false}}
function login(){root.innerHTML='<div class="card"><h2>الدخول إلى الجدول</h2><p>استخدم حساب الموقع لحماية أرقام الموظفين. يُحفظ الدخول على جهازك.</p><form id="login"><label>البريد الإلكتروني<input type="email" name="email" required></label><label>كلمة المرور<input type="password" name="password" required></label><button>دخول</button></form><p class="hint">يجب إعداد حساب الدخول أولاً في Supabase.</p></div>';document.getElementById('login').onsubmit=async e=>{e.preventDefault();let x=new FormData(e.target);notify('جارٍ الدخول...');let r=await db.auth.signInWithPassword({email:x.get('email'),password:x.get('password')});if(r.error)showError(r.error);else{session=r.data.session;await load()}}}
async function load(){try{const r=await Promise.all([db.from('departments').select('*').order('created_at'),db.from('employees').select('*').order('created_at'),db.from('rotation_changes').select('*'),db.from('schedule_overrides').select('*')]);let error=r.find(x=>x.error);if(error)throw error.error;[departments,employees,rotations,overrides]=r.map(x=>x.data);if(dept&&!departments.some(x=>x.id===dept))dept=null;render()}catch(e){showError(e)}}
function render(){if(!session){login();return}let d=departments.find(x=>x.id===dept);if(!d){root.innerHTML='<div class="bar"><h2>الأقسام</h2><button id="addDepartment">+ إضافة قسم</button></div><div class="grid">'+(departments.length?departments.map(x=>'<div class="card"><h3>'+escape(x.name)+'</h3><p>'+employees.filter(e=>e.department_id===x.id).length+' موظف</p><div class="actions"><button data-open="'+x.id+'">فتح القسم</button><button class="sub" data-rename="'+x.id+'">تعديل</button><button class="danger" data-delete="'+x.id+'">حذف</button></div></div>').join(''):'<div class="card">لا توجد أقسام بعد. ابدأ بإضافة قسم.</div>')+'</div>';document.getElementById('addDepartment').onclick=async()=>{let n=prompt('اسم القسم');if(n&&n.trim())await act(db.from('departments').insert({name:n.trim()}))};root.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{dept=b.dataset.open;offset=0;render()});root.querySelectorAll('[data-rename]').forEach(b=>b.onclick=async()=>{let x=departments.find(z=>z.id===b.dataset.rename);let n=prompt('اسم القسم',x.name);if(n&&n.trim())await act(db.from('departments').update({name:n.trim()}).eq('id',x.id))});root.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(confirm('سيُحذف القسم وجميع موظفيه ودوامهم. هل تريد المتابعة؟'))await act(db.from('departments').delete().eq('id',b.dataset.delete))});return}
let now=new Date(),start,count;if(mode==='month'){start=new Date(now.getFullYear(),now.getMonth()+offset,1,12);count=new Date(start.getFullYear(),start.getMonth()+1,0).getDate()}else{count=Number(mode);start=monday(now);start.setDate(start.getDate()+offset*count)}let days=Array.from({length:count},(_,i)=>new Date(start.getFullYear(),start.getMonth(),start.getDate()+i,12));let roster=employees.filter(x=>x.department_id===d.id);
function status(emp,date){let key=dateStr(date),ov=overrides.find(x=>x.employee_id===emp.id&&x.day===key);if(ov)return ov.status;let w=date.getDay();if(w===0)return'off';if(w>=1&&w<=4)return'work';let startweek=monday(date), change=rotations.filter(x=>x.employee_id===emp.id&&x.week_start<=dateStr(startweek)).sort((a,b)=>b.week_start.localeCompare(a.week_start))[0],phase;if(change)phase=((weekDiff(startweek,fromDay(change.week_start))+change.phase)%2+2)%2;else phase=((weekDiff(startweek,new Date(2026,10,2,12))+emp.phase)%2+2)%2;return(w===5&&phase===0||w===6&&phase===1)?'work':'off'}
root.innerHTML='<div class="bar"><h2>'+escape(d.name)+'</h2><div class="actions"><button class="sub" id="back">رجوع</button><button id="addEmployee">+ إضافة موظف</button></div></div><div class="card"><div class="actions"><button class="sub" id="prev">السابق</button><button class="sub" id="next">التالي</button><select id="period"><option value="month">شهر</option><option value="7">أسبوع</option><option value="14">أسبوعان</option><option value="28">4 أسابيع</option></select><strong>'+escape(start.toLocaleDateString('ar-AE',{month:'long',year:'numeric'}))+'</strong></div><p class="hint">اضغط على اليوم لتعديل الدوام. الأخضر دوام، الأصفر إجازة، الأزرق إجازة خاصة.</p><div class="scroll"><table><thead><tr><th>الموظف</th>'+days.map(t=>'<th>'+t.getDate()+'<br>'+escape(t.toLocaleDateString('ar-AE',{weekday:'short'}))+'</th>').join('')+'</tr></thead><tbody>'+(roster.length?roster.map(e=>'<tr><th>'+escape(e.name)+'<br><button class="sub small" data-edit="'+e.id+'">تعديل</button><button class="danger small" data-remove="'+e.id+'">حذف</button></th>'+days.map(t=>{let s=status(e,t);return'<td class="'+s+'" data-emp="'+e.id+'" data-date="'+dateStr(t)+'">'+({work:'دوام',off:'إجازة',leave:'إجازة خاصة'})[s]+'</td>'}).join('')+'</tr>').join(''):'<tr><td colspan="'+(count+1)+'">لا يوجد موظفون بعد</td></tr>')+'</tbody></table></div></div>';
document.getElementById('back').onclick=()=>{dept=null;render()};document.getElementById('prev').onclick=()=>{offset--;render()};document.getElementById('next').onclick=()=>{offset++;render()};let select=document.getElementById('period');select.value=mode;select.onchange=()=>{mode=select.value;offset=0;render()};
document.getElementById('addEmployee').onclick=async()=>{let n=prompt('اسم الموظف');if(!n||!n.trim())return;let p=prompt('رقم الهاتف (اختياري)')||'';let group=confirm('هل هو في المجموعة الثانية؟ اختر إلغاء للمجموعة الأولى.')?1:0;await act(db.from('employees').insert({department_id:dept,name:n.trim(),phone:p.trim(),phase:group}))};
root.querySelectorAll('[data-edit]').forEach(b=>b.onclick=async()=>{let e=roster.find(x=>x.id===b.dataset.edit),n=prompt('اسم الموظف',e.name);if(!n||!n.trim())return;let p=prompt('رقم الهاتف',e.phone);if(p===null)return;await act(db.from('employees').update({name:n.trim(),phone:p.trim()}).eq('id',e.id))});
root.querySelectorAll('[data-remove]').forEach(b=>b.onclick=async()=>{if(confirm('حذف الموظف وكل تعديلاته؟'))await act(db.from('employees').delete().eq('id',b.dataset.remove))});
root.querySelectorAll('[data-date]').forEach(b=>b.onclick=async()=>{let choice=prompt('اختر الرقم: 1 دوام، 2 إجازة، 3 إجازة خاصة، 0 تلقائي','0');if(choice===null)return;let emp=b.dataset.emp,day=b.dataset.date,dayNum=fromDay(day).getDay();if(choice==='0'){await act(db.from('schedule_overrides').delete().eq('employee_id',emp).eq('day',day));return}let s={'1':'work','2':'off','3':'leave'}[choice];if(!s){notify('اختيار غير صحيح');return}if((dayNum===5||dayNum===6)&&s!=='leave'){if(!confirm('سيُغيّر ذلك التناوب من هذا الأسبوع فصاعداً. هل تريد المتابعة؟'))return;await act(db.rpc('set_weekend_rotation',{p_employee:emp,p_day:day,p_status:s}))}else await act(db.from('schedule_overrides').upsert({employee_id:emp,day,status:s},{onConflict:'employee_id,day'}))});
}
document.getElementById('logout').onclick=async()=>{await db.auth.signOut();session=null;dept=null;login()};
db.auth.getSession().then(async({data,error})=>{if(error){showError(error);return}session=data.session;if(session)await load();else login()});
})();</script></body></html>
