<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#18356f"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><script>window.deferredInstall=null;window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();window.deferredInstall=e});</script><title>بنك الشارقة | جدول الفريق</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#1d2e4a;font:16px/1.6 Tahoma,Arial,sans-serif}header{background:white;text-align:center;border-bottom:3px solid #c5a45b;padding:18px}.logo{display:grid;place-items:center;background:#18356f;color:white;border-radius:14px;width:50px;height:50px;margin:auto;font-weight:bold;font-size:22px}h1,h2,h3{color:#18356f}h1{font-size:24px;margin:5px}main{max-width:1100px;margin:auto;padding:20px 15px}.bar,.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.bar{justify-content:space-between;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.card{background:white;border:1px solid #dce4ef;border-radius:14px;padding:16px}.card h3{margin:0}.scroll{overflow:auto;max-width:100%}table{border-collapse:collapse;font-size:13px}th,td{border:1px solid #dce4ef;padding:8px;text-align:center;min-width:52px}th:first-child{position:sticky;right:0;z-index:1;background:#f8faff;min-width:130px}td[data-date]{cursor:pointer}.work{background:#d8f1de}.off{background:#fff2bc}.leave{background:#d5eafa}button,select,input{font:inherit;border-radius:8px;padding:9px;border:1px solid #ccd8e8}button{background:#18356f;color:white;border:0;cursor:pointer}.sub{background:#eaf0f8;color:#18356f}.danger{background:#fff0f0;color:#a32b2b}.small{font-size:12px;padding:5px}label{display:block;margin:12px 0}input{display:block;width:100%;max-width:350px}.hint,#message{color:#596b83;font-size:14px}#message{min-height:24px}#logout{position:static}@media(max-width:600px){header{padding:14px}h1{font-size:20px}main{padding:12px}th,td{padding:7px;min-width:45px}}.bank-logo{display:block;width:auto;max-width:min(260px,80%);max-height:118px;object-fit:contain;margin:0 auto 6px}.bank-name{color:#18356f;font-weight:bold;font-size:16px}@media(max-width:600px){.bank-logo{max-width:min(210px,75%);max-height:95px}}.top-actions{position:absolute;top:12px;left:12px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-start}.top-actions button{font-size:14px;padding:8px}.summary-layout{display:grid;grid-template-columns:minmax(220px,290px) minmax(0,1fr);gap:14px;direction:rtl;align-items:start}.summary{background:#f8faff;border:1px solid #dce4ef;border-radius:12px;padding:14px}.summary h3{margin:0 0 10px;font-size:17px}.summary-row{border-top:1px solid #e4ebf4;padding:9px 0}.summary-row:first-of-type{border-top:0}.summary-row strong{display:block;overflow-wrap:anywhere}.summary-meta{font-size:13px;color:#596b83}.work-time{color:#596b83;font-size:13px}.install-note{max-width:520px;margin:10px auto;background:#fff7df;border-radius:9px;padding:10px;color:#5c4810;font-size:14px}.settings-dialog{width:min(480px,94vw);max-height:90vh;overflow:auto;border:0;border-radius:14px;box-shadow:0 12px 45px #11223a55}.settings-dialog::backdrop{background:#10234299}.settings-dialog label{font-size:14px}.settings-dialog input{width:100%;max-width:none}.settings-dialog .form-actions{display:flex;gap:8px;margin-top:16px}@media(max-width:700px){.summary-layout{grid-template-columns:minmax(0,1fr)}.top-actions{position:static;justify-content:center;margin-bottom:10px}.top-actions button{font-size:12px;padding:7px}}</style></head><body><header><div class="top-actions"><button class="sub" id="install">تثبيت التطبيق</button><button class="sub" id="settings" hidden>الإعدادات</button><button class="sub" id="logout" hidden>خروج</button></div><img id="bankLogo" class="bank-logo" src="https://banksdataworldwide.com/assets/banks-images/ae/BankofSharjah/logo.png" alt="شعار بنك الشارقة"><div id="brandName" class="bank-name">بنك الشارقة</div><h1 id="pageTitle">جدول الفريق</h1><small id="pageSubtitle">الدوام والإجازات في مكان واحد</small></header><main><div id="message" role="status"></div><div id="installNote" class="install-note" hidden></div><dialog id="settingsDialog" class="settings-dialog"><form id="settingsForm"><h2>إعدادات الصفحة</h2><label>اسم الجهة<input name="brand_name" maxlength="80" required></label><label>العنوان الرئيسي<input name="page_title" maxlength="100" required></label><label>النص أسفل العنوان<input name="subtitle" maxlength="140"></label><label>رابط الشعار (https)<input name="logo_url" type="url"></label><label>أو اختر صورة شعار جديدة (PNG أو JPG أو WebP، حتى 200 كيلوبايت)<input name="logo_file" type="file" accept="image/png,image/jpeg,image/webp"></label><p class="work-time">أوقات العمل العامة اختيارية وتظهر كمرجع للقسم، وليست مواعيد فردية للموظفين.</p><label>بداية الدوام العامة<input name="work_start" type="time"></label><label>نهاية الدوام العامة<input name="work_end" type="time"></label><div class="form-actions"><button type="submit">حفظ الإعدادات</button><button type="button" class="sub" id="closeSettings">إلغاء</button></div></form></dialog><div id="app">جارٍ التحميل...</div><p class="hint">التنبيهات غير مفعّلة حالياً.</p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script><script>(function(){
const db=window.supabase.createClient('https://tlrwmxgnxidytsoyqvjz.supabase.co','sb_publishable_tWSCm6CN_-VKcYLZm8mBKQ_VdZ030EO');
const root=document.getElementById('app');let session=null,departments=[],employees=[],rotations=[],overrides=[],settings=null,dept=null,offset=0,mode='month';
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=()=>crypto.randomUUID(), dateStr=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const fromDay=s=>{let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)};
const monday=d=>{let n=new Date(d.getFullYear(),d.getMonth(),d.getDate(),12);n.setDate(n.getDate()-((n.getDay()+6)%7));return n};
const weekDiff=(a,b)=>Math.round((Date.UTC(a.getFullYear(),a.getMonth(),a.getDate())-Date.UTC(b.getFullYear(),b.getMonth(),b.getDate()))/604800000);
function notify(text){document.getElementById('message').textContent=text}
function showError(err){notify('تعذر إتمام العملية: '+(err?.message||String(err)))}
async function act(p){try{notify('جارٍ الحفظ...');let r=await p;if(r.error)throw r.error;await load();notify('تم الحفظ');return true}catch(e){showError(e);return false}}
function login(){document.getElementById('settings').hidden=true;document.getElementById('logout').hidden=true;root.innerHTML='<div class="card"><h2>الدخول إلى الجدول</h2><p>استخدم حساب الموقع لحماية أرقام الموظفين. يُحفظ الدخول على جهازك.</p><form id="login"><label>البريد الإلكتروني<input type="email" name="email" required></label><label>كلمة المرور<input type="password" name="password" required></label><button>دخول</button></form><p class="hint">يجب إعداد حساب الدخول أولاً في Supabase.</p></div>';document.getElementById('login').onsubmit=async e=>{e.preventDefault();let x=new FormData(e.target);notify('جارٍ الدخول...');let r=await db.auth.signInWithPassword({email:x.get('email'),password:x.get('password')});if(r.error)showError(r.error);else{session=r.data.session;await load()}}}
async function load(){try{const r=await Promise.all([db.from('departments').select('*').order('created_at'),db.from('employees').select('*').order('created_at'),db.from('rotation_changes').select('*'),db.from('schedule_overrides').select('*'),db.from('page_settings').select('*').maybeSingle()]);let error=r.find(x=>x.error);if(error)throw error.error;[departments,employees,rotations,overrides,settings]=r.map(x=>x.data);applySettings();document.getElementById('settings').hidden=false;document.getElementById('logout').hidden=false;if(dept&&!departments.some(x=>x.id===dept))dept=null;render()}catch(e){showError(e)}}
function render(){if(!session){login();return}let d=departments.find(x=>x.id===dept);if(!d){root.innerHTML='<div class="bar"><h2>الأقسام</h2><button id="addDepartment">+ إضافة قسم</button></div><div class="grid">'+(departments.length?departments.map(x=>'<div class="card"><h3>'+escape(x.name)+'</h3><p>'+employees.filter(e=>e.department_id===x.id).length+' موظف</p><div class="actions"><button data-open="'+x.id+'">فتح القسم</button><button class="sub" data-rename="'+x.id+'">تعديل</button><button class="danger" data-delete="'+x.id+'">حذف</button></div></div>').join(''):'<div class="card">لا توجد أقسام بعد. ابدأ بإضافة قسم.</div>')+'</div>';document.getElementById('addDepartment').onclick=async()=>{let n=prompt('اسم القسم');if(n&&n.trim())await act(db.from('departments').insert({name:n.trim()}))};root.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{dept=b.dataset.open;offset=0;render()});root.querySelectorAll('[data-rename]').forEach(b=>b.onclick=async()=>{let x=departments.find(z=>z.id===b.dataset.rename);let n=prompt('اسم القسم',x.name);if(n&&n.trim())await act(db.from('departments').update({name:n.trim()}).eq('id',x.id))});root.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(confirm('سيُحذف القسم وجميع موظفيه ودوامهم. هل تريد المتابعة؟'))await act(db.from('departments').delete().eq('id',b.dataset.delete))});return}
let now=new Date(),start,count;if(mode==='month'){start=new Date(now.getFullYear(),now.getMonth()+offset,1,12);count=new Date(start.getFullYear(),start.getMonth()+1,0).getDate()}else{count=Number(mode);start=monday(now);start.setDate(start.getDate()+offset*count)}let days=Array.from({length:count},(_,i)=>new Date(start.getFullYear(),start.getMonth(),start.getDate()+i,12));let roster=employees.filter(x=>x.department_id===d.id);
function status(emp,date){let key=dateStr(date),ov=overrides.find(x=>x.employee_id===emp.id&&x.day===key);if(ov)return ov.status;let w=date.getDay();if(w===0)return'off';if(w>=1&&w<=4)return'work';let startweek=monday(date), change=rotations.filter(x=>x.employee_id===emp.id&&x.week_start<=dateStr(startweek)).sort((a,b)=>b.week_start.localeCompare(a.week_start))[0],phase;if(change)phase=((weekDiff(startweek,fromDay(change.week_start))+change.phase)%2+2)%2;else phase=((weekDiff(startweek,new Date(2026,10,2,12))+emp.phase)%2+2)%2;return(w===5&&phase===0||w===6&&phase===1)?'work':'off'}
let summary='<aside class="summary"><h3>ملخص الفريق</h3><p class="work-time">'+(settings?.work_start&&settings?.work_end?'الدوام العام: '+escape(settings.work_start.slice(0,5))+' – '+escape(settings.work_end.slice(0,5)):'وقت الدوام العام غير محدد')+'</p>'+(roster.length?roster.map(e=>{let a={work:0,off:0,leave:0};days.forEach(day=>{a[status(e,day)]++});return '<div class="summary-row"><strong>'+escape(e.name)+'</strong><span class="summary-meta">دوام '+a.work+' · إجازة '+a.off+' · خاصة '+a.leave+'</span></div>'}).join(''):'<p class="summary-meta">لا يوجد موظفون بعد.</p>')+'</aside>';root.innerHTML='<div class="bar"><h2>'+escape(d.name)+'</h2><div class="actions"><button class="sub" id="back">رجوع</button><button id="addEmployee">+ إضافة موظف</button></div></div><div class="card"><div class="actions"><button class="sub" id="prev">السابق</button><button class="sub" id="next">التالي</button><select id="period"><option value="month">شهر</option><option value="7">أسبوع</option><option value="14">أسبوعان</option><option value="28">4 أسابيع</option></select><strong>'+escape(start.toLocaleDateString('ar-AE',{month:'long',year:'numeric'}))+'</strong></div><p class="hint">اضغط على اليوم لتعديل الدوام. الأخضر دوام، الأصفر إجازة، الأزرق إجازة خاصة.</p><div class="summary-layout">'+summary+'<div class="scroll"><table><thead><tr><th>الموظف</th>'+days.map(t=>'<th>'+t.getDate()+'<br>'+escape(t.toLocaleDateString('ar-AE',{weekday:'short'}))+'</th>').join('')+'</tr></thead><tbody>'+(roster.length?roster.map(e=>'<tr><th>'+escape(e.name)+'<br><button class="sub small" data-edit="'+e.id+'">تعديل</button><button class="danger small" data-remove="'+e.id+'">حذف</button></th>'+days.map(t=>{let s=status(e,t);return'<td class="'+s+'" data-emp="'+e.id+'" data-date="'+dateStr(t)+'">'+({work:'دوام',off:'إجازة',leave:'إجازة خاصة'})[s]+'</td>'}).join('')+'</tr>').join(''):'<tr><td colspan="'+(count+1)+'">لا يوجد موظفون بعد</td></tr>')+'</tbody></table></div></div></div>';
document.getElementById('back').onclick=()=>{dept=null;render()};document.getElementById('prev').onclick=()=>{offset--;render()};document.getElementById('next').onclick=()=>{offset++;render()};let select=document.getElementById('period');select.value=mode;select.onchange=()=>{mode=select.value;offset=0;render()};
document.getElementById('addEmployee').onclick=async()=>{let n=prompt('اسم الموظف');if(!n||!n.trim())return;let p=prompt('رقم الهاتف (اختياري)')||'';let group=confirm('هل هو في المجموعة الثانية؟ اختر إلغاء للمجموعة الأولى.')?1:0;await act(db.from('employees').insert({department_id:dept,name:n.trim(),phone:p.trim(),phase:group}))};
root.querySelectorAll('[data-edit]').forEach(b=>b.onclick=async()=>{let e=roster.find(x=>x.id===b.dataset.edit),n=prompt('اسم الموظف',e.name);if(!n||!n.trim())return;let p=prompt('رقم الهاتف',e.phone);if(p===null)return;await act(db.from('employees').update({name:n.trim(),phone:p.trim()}).eq('id',e.id))});
root.querySelectorAll('[data-remove]').forEach(b=>b.onclick=async()=>{if(confirm('حذف الموظف وكل تعديلاته؟'))await act(db.from('employees').delete().eq('id',b.dataset.remove))});
root.querySelectorAll('[data-date]').forEach(b=>b.onclick=async()=>{let choice=prompt('اختر الرقم: 1 دوام، 2 إجازة، 3 إجازة خاصة، 0 تلقائي','0');if(choice===null)return;let emp=b.dataset.emp,day=b.dataset.date,dayNum=fromDay(day).getDay();if(choice==='0'){let hasOverride=overrides.some(x=>x.employee_id===emp&&x.day===day);if(!hasOverride&&(dayNum===5||dayNum===6)){if(!confirm('إلغاء تعديل التناوب لهذا الأسبوع والعودة للتناوب السابق؟'))return;await act(db.rpc('clear_weekend_rotation',{p_employee:emp,p_day:day}))}else await act(db.from('schedule_overrides').delete().eq('employee_id',emp).eq('day',day));return}let s={'1':'work','2':'off','3':'leave'}[choice];if(!s){notify('اختيار غير صحيح');return}if((dayNum===5||dayNum===6)&&s!=='leave'){if(!confirm('سيُغيّر ذلك التناوب من هذا الأسبوع، مع الحفاظ على تعديلات التناوب اللاحقة والإجازات الخاصة. هل تريد المتابعة؟'))return;await act(db.rpc('set_weekend_rotation',{p_employee:emp,p_day:day,p_status:s}))}else await act(db.from('schedule_overrides').upsert({employee_id:emp,day,status:s},{onConflict:'employee_id,day'}))});
}
function applySettings(){const def={brand_name:'بنك الشارقة',page_title:'جدول الفريق',subtitle:'الدوام والإجازات في مكان واحد',logo_url:'https://banksdataworldwide.com/assets/banks-images/ae/BankofSharjah/logo.png'};let v={...def,...(settings||{})};document.getElementById('brandName').textContent=v.brand_name;document.getElementById('pageTitle').textContent=v.page_title;document.getElementById('pageSubtitle').textContent=v.subtitle||'';document.title=v.brand_name+' | '+v.page_title;let logo=document.getElementById('bankLogo');let valid=/^https:\/\//i.test(v.logo_url||'')||/^data:image\/(png|jpeg|webp);base64,/i.test(v.logo_url||'');logo.src=valid?v.logo_url:def.logo_url;logo.alt='شعار '+v.brand_name}
const dialog=document.getElementById('settingsDialog'), form=document.getElementById('settingsForm');
document.getElementById('settings').onclick=()=>{let v=settings||{};for(const [name,val] of Object.entries({brand_name:v.brand_name||'بنك الشارقة',page_title:v.page_title||'جدول الفريق',subtitle:v.subtitle??'الدوام والإجازات في مكان واحد',logo_url:(v.logo_url||'').startsWith('https://')?v.logo_url:'',work_start:(v.work_start||'').slice(0,5),work_end:(v.work_end||'').slice(0,5)}))form.elements[name].value=val;form.elements.logo_file.value='';dialog.showModal()};
document.getElementById('closeSettings').onclick=()=>dialog.close();
form.onsubmit=async e=>{e.preventDefault();try{let f=new FormData(form),file=f.get('logo_file'),url=String(f.get('logo_url')||'').trim();if(url&&!/^https:\/\//i.test(url))throw Error('يجب أن يبدأ رابط الشعار بـ https://');if(file&&file.size){if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>204800)throw Error('اختر صورة PNG أو JPG أو WebP بحجم لا يتجاوز 200 كيلوبايت');url=await new Promise((resolve,reject)=>{let reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(Error('تعذرت قراءة الشعار'));reader.readAsDataURL(file)})}if(!url)url=settings?.logo_url||'https://banksdataworldwide.com/assets/banks-images/ae/BankofSharjah/logo.png';let a=String(f.get('work_start')||''),b=String(f.get('work_end')||'');if((a&&!b)||(!a&&b))throw Error('أدخل بداية ونهاية الدوام أو اتركهما فارغتين');let row={owner_id:session.user.id,brand_name:String(f.get('brand_name')).trim(),page_title:String(f.get('page_title')).trim(),subtitle:String(f.get('subtitle')).trim(),logo_url:url,work_start:a||null,work_end:b||null,updated_at:new Date().toISOString()};let saved=await act(db.from('page_settings').upsert(row,{onConflict:'owner_id'}));if(saved)dialog.close()}catch(err){showError(err)}};
document.getElementById('install').onclick=async()=>{const note=document.getElementById('installNote');if(matchMedia('(display-mode: standalone)').matches||navigator.standalone){note.hidden=false;note.textContent='التطبيق مثبت ومفتوح بالفعل.';return}if(window.deferredInstall){let p=window.deferredInstall;window.deferredInstall=null;await p.prompt();note.hidden=false;note.textContent='اتبع نافذة التأكيد التي يعرضها المتصفح.'}else{note.hidden=false;note.textContent=/iPhone|iPad|iPod/i.test(navigator.userAgent)?'على iPhone: افتح الموقع في Safari، واضغط مشاركة ثم «إضافة إلى الشاشة الرئيسية».':'إذا لم تظهر نافذة التثبيت، افتح قائمة المتصفح واختر «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».'}};
window.addEventListener('appinstalled',()=>{window.deferredInstall=null;let n=document.getElementById('installNote');n.hidden=false;n.textContent='تم تثبيت التطبيق.'});
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
document.getElementById('logout').onclick=async()=>{await db.auth.signOut();session=null;dept=null;login()};
db.auth.getSession().then(async({data,error})=>{if(error){showError(error);return}session=data.session;if(session)await load();else login()});
})();</script></body></html>
